<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục CSS Grid 3 Cột</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .grid-item {
            background-color: #f0f0f0; /* Xám nhạt */
            border-radius: 10px;       /* Bo góc 10px */
            padding: 20px;
            text-align: center;
            /* Thêm một chút đổ bóng cho đẹp (không bắt buộc) */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
        }
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="grid-item">
            <h2>Cột 1</h2>
            <p>Nội dung của cột thứ nhất nằm ở đây.</p>
        </div>
        <div class="grid-item">
            <h2>Cột 2</h2>
            <p>Nội dung của cột thứ hai nằm ở đây.</p>
        </div>
        <div class="grid-item">
            <h2>Cột 3</h2>
            <p>Nội dung của cột thứ ba nằm ở đây.</p>
        </div>
    </div>

</body>
</html>
